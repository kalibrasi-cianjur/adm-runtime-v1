<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta http-equiv="Content-Security-Policy"
      content="
        default-src 'self';
        img-src 'self' data: blob: https://hlleyvltrlopiagyrvbr.supabase.co;
        script-src 'self';
        style-src 'self' 'unsafe-inline';
      ">
<title>Admin Sparepart Requests</title>

<style>
body {
  font-family: Arial, sans-serif;
  background: #f4f6f8;
  margin: 0;
  padding: 20px;
}

h1 {
  margin-bottom: 15px;
}

.toolbar {
  display: flex;
  gap: 10px;
  margin-bottom: 15px;
}

input, select, button {
  padding: 8px 10px;
  border-radius: 6px;
  border: 1px solid #ccc;
}

button {
  cursor: pointer;
}

table {
  width: 100%;
  border-collapse: collapse;
  background: #fff;
}

th, td {
  padding: 10px;
  border-bottom: 1px solid #ddd;
  text-align: left;
}

th {
  background: #eee;
}

/* STATUS */
.status {
  padding: 4px 8px;
  border-radius: 6px;
  font-size: 12px;
  font-weight: bold;
}

.status.PENDING { background: orange; color: #000; }
.status.APPROVED { background: green; color: #fff; }
.status.REJECTED { background: red; color: #fff; }

/* FOTO */
.foto-thumb {
  width: 60px;
  height: 60px;
  object-fit: cover;
  border-radius: 6px;
  cursor: pointer;
  transition: transform .2s;
}

.foto-thumb:hover {
  transform: scale(1.1);
}

/* OVERLAY */
#photoOverlay {
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,.85);
  display: none;
  align-items: center;
  justify-content: center;
  z-index: 9999;
}

#photoOverlay img {
  max-width: 90%;
  max-height: 90%;
  border-radius: 10px;
  box-shadow: 0 0 30px rgba(0,0,0,.8);
}

#btnSync {
  position: relative;
}

#notifBadge {
  position: absolute;
  top: -6px;
  right: -6px;
  background: red;
  color: white;
  font-size: 11px;
  padding: 2px 6px;
  border-radius: 999px;
  font-weight: bold;
}


.toast {
  position: relative;
  min-width: 220px;
  background: #1f1f1f !important;
  color: #fff !important;
  padding: 12px 18px !important;
  border-radius: 8px !important;
  font-size: 14px !important;
  box-shadow: 0 5px 15px rgba(0,0,0,0.25);
  pointer-events: auto;
  overflow: hidden;
  border-left: 5px solid #ccc !important;
}

/* Warna per tipe */
.toast.success { border-left-color: #4caf50 !important; }
.toast.error   { border-left-color: #ff4d4d !important; }
.toast.info    { border-left-color: #2196f3 !important; }

/* Progress Bar */
.toast .bar {
  position: absolute;
  bottom: 0;
  left: 0;
  height: 4px;
  width: 100%;
  background: rgba(255,255,255,0.15);
}

.toast .bar .fill {
  height: 100%;
  width: 100%;
  background: currentColor;
  transition: width linear;
}

.toast.show {
  opacity: 1;
  transform: translateY(0);
}

.toast.hidden {
  display: none;
}

tr.new-row {
  animation: flash 2s ease;
  background: #fff3cd;
}

@keyframes flash {
  0% { background: #ffeaa7; }
  100% { background: transparent; }
}

.highlight {
  background: yellow;
  font-weight: bold;
}





.btn-approve {
  background: #2ecc71;
  color: white;
  border: none;
  padding: 6px 10px;
  border-radius: 6px;
  cursor: pointer;
}

.btn-reject {
  background: #e74c3c;
  color: white;
  border: none;
  padding: 6px 10px;
  border-radius: 6px;
  cursor: pointer;
}

button:disabled {
  opacity: 0.6;
  cursor: not-allowed;
}



.overlay {
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.6);
  display: flex;
  align-items: center;
  justify-content: center;
  z-index: 999;
}

.hidden {
  display: none;
}

.modal {
  background: #fff;
  width: 360px;
  padding: 16px;
  border-radius: 8px;
}

.modal textarea {
  width: 100%;
  min-height: 90px;
  margin-top: 10px;
}

.modal-actions {
  display: flex;
  justify-content: flex-end;
  gap: 8px;
  margin-top: 12px;
}

button.primary {
  background: #2563eb;
  color: white;
}

.badge {
  position: relative;
  display: inline-flex;
  flex-direction: column;
  align-items: center;
  gap: 4px;

  padding: 7px 12px;
  min-width: 100px;

  border-radius: 14px;

  font-size: 11px;
  font-weight: 700;
  line-height: 1.2;
  text-align: center;

  color: #fff;
  cursor: help;

  box-shadow:
    inset 0 0 0 1px rgba(255,255,255,.12),
    0 2px 6px rgba(0,0,0,.15);

  transition:
    transform .15s ease,
    box-shadow .15s ease,
    filter .15s ease;
}

/* ================= HOVER EFFECT ================= */
.badge:hover {
  transform: translateY(-1px) scale(1.02);
  box-shadow:
    inset 0 0 0 1px rgba(255,255,255,.18),
    0 6px 14px rgba(0,0,0,.25);
  filter: brightness(1.05);
}

/* ================= TITLE ================= */
.badge .badge-title {
  font-size: 12px;
  letter-spacing: .4px;
}

/* ================= META (PR / PO) ================= */
.badge .badge-meta {
  display: flex;
  gap: 6px;
  font-size: 10px;
  opacity: .9;
}

.badge .badge-meta span {
  padding: 2px 6px;
  border-radius: 8px;
  background: rgba(255,255,255,.15);
}

/* ================= TOOLTIP ================= */
.badge::after {
  content: attr(data-tooltip);
  position: absolute;
  bottom: 135%;
  left: 50%;
  transform: translateX(-50%) translateY(4px);

  background: #1f2937;
  color: #fff;

  padding: 8px 12px;
  border-radius: 10px;

  font-size: 12px;
  line-height: 1.4;
  white-space: pre-line;

  opacity: 0;
  pointer-events: none;

  box-shadow: 0 12px 24px rgba(0,0,0,.35);
  transition: opacity .2s ease, transform .2s ease;
  z-index: 999;
}

.badge::before {
  content: "";
  position: absolute;
  bottom: 125%;
  left: 50%;
  transform: translateX(-50%) translateY(4px);

  border-width: 7px;
  border-style: solid;
  border-color: #1f2937 transparent transparent transparent;

  opacity: 0;
  transition: opacity .2s ease, transform .2s ease;
}

.badge:hover::after,
.badge:hover::before {
  opacity: 1;
  transform: translateX(-50%) translateY(0);
}

/* ================= STATUS COLORS ================= */
.badge-APPROVED {
  background: linear-gradient(135deg, #3b82f6, #2563eb);
}

.badge-PR {
  background: linear-gradient(135deg, #a855f7, #7c3aed);
}

.badge-PO {
  background: linear-gradient(135deg, #f59e0b, #d97706);
}

.badge-SERAH-TERIMA {
  background: linear-gradient(135deg, #10b981, #059669);
}

.badge-ONSITE {
  background: linear-gradient(135deg, #22c55e, #15803d);
}



.status.CLOSED {
  color: #2e7d32;
  font-weight: bold;
}



</style>
</head>
<!-- ================= ADMIN FEEDBACK MODAL ================= -->
<div id="feedbackOverlay" class="overlay hidden">
  <div class="modal">
    <h3 id="feedbackTitle">Admin Note</h3>

    <textarea
      id="feedbackInput"
      placeholder="Masukkan catatan admin..."
    ></textarea>

    <div class="modal-actions">
      <button id="btnFeedbackCancel">Batal</button>
      <button id="btnFeedbackSubmit" class="primary">Kirim</button>
    </div>
  </div>
</div>


<div id="progressOverlay" class="overlay hidden">
  <div class="modal">
    <h3 id="progressTitle"></h3>
    <input id="progressInput" placeholder="">
    <div class="actions">
      <button id="progressCancel">Batal</button>
      <button id="progressSubmit">Simpan</button>
    </div>
  </div>
</div>

<body>
<div id="toast" class="toast hidden">
  🔔 Request sparepart baru masuk
</div>

   <button id="btnSync">
    🔄 Sync
    <span id="notifBadge" style="display:none;">0</span>

</div>

<table>
  <thead>
    <tr>
      <th>Tanggal</th>
      <th>Request</th>
      <th>Mesin</th>

    </tr>

  <tbody id="tableBody"></tbody>
</table>

<!-- OVERLAY FOTO -->
<div id="photoOverlay">
  <img id="photoPreview">
</div>

<script src="admin_sparepart.js"></script>
</body>
</html>
