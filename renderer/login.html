<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Login - Sparepart App</title>
  <link rel="stylesheet" href="style.css">
  <style>
    .login-container {
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      background: linear-gradient(135deg, #0078ff, #004080);
      color: white;
    }

    .login-box {
      background: rgba(255, 255, 255, 0.15);
      border: 1px solid rgba(255, 255, 255, 0.3);
      border-radius: 14px;
      backdrop-filter: blur(10px);
      padding: 30px 28px;
      width: 320px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.3);
    }

    .login-box h2 {
      text-align: center;
      color: #fff;
      margin-bottom: 20px;
    }

    .login-box input {
      width: 100%;
      padding: 10px;
      margin: 10px 0;
      border: none;
      border-radius: 6px;
      outline: none;
      background: rgba(255, 255, 255, 0.25);
      color: #fff;
      font-size: 14px;
    }

    .login-box button {
      width: 100%;
      padding: 10px;
      background: #0078ff;
      color: white;
      font-weight: bold;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      margin-top: 10px;
      transition: 0.2s;
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 8px;
    }

    .login-box button:hover {
      background: #005ecc;
    }

    .login-box button:disabled {
      background: #004080;
      cursor: not-allowed;
      opacity: 0.8;
    }

.visitor-btn {
  width: 100%;
  padding: 10px;
  background: rgba(255, 255, 255, 0.2);
  color: #fff;
  font-weight: bold;
  border: 1px solid rgba(255,255,255,0.4);
  border-radius: 6px;
  cursor: pointer;
  margin-top: 8px;
  transition: 0.3s;
}
.visitor-btn:hover {
  background: rgba(255,255,255,0.3);
}

    .spinner {
      display: none;
      width: 16px;
      height: 16px;
      border: 2px solid rgba(255, 255, 255, 0.3);
      border-top: 2px solid #fff;
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
    }

    @keyframes spin {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }

    .error {
      color: #ff8080;
      text-align: center;
      margin-top: 10px;
      font-size: 13px;
    }
  </style>
</head>
<body>
  <div class="login-container">
    <div class="login-box">
      <h2>Login</h2>
      <input id="username" type="text" placeholder="Username">
      <input id="password" type="password" placeholder="Password">
      <button id="loginBtn">
        <span id="btnText">Masuk</span>
        <span class="spinner" id="spinner"></span>
      </button>
      <button id="visitorBtn" class="visitor-btn">Masuk sebagai Visitor</button>

      <div class="error" id="errorMsg"></div>
    </div>
  </div>

  <script src="login.js"></script>
</body>
</html>
