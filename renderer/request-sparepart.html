function normalize(str) {
  return str.toLowerCase().replace(/\s+/g, "").replace(/[^a-z0-9]/g, "");
}


async function loadAllLocations() {
  try {
    const { data, error } = await supabaseClient
      .from("locations")
      .select("id, function_location, sub_location")
      .order("function_location", { ascending: true });

    if (error) throw error;

    allLocations = data || [];
    console.log("☁️ Loaded locations (cloud):", allLocations.length);
    showToast(`☁️ Lokasi dari cloud: ${allLocations.length}`, "success");

  }
}


async function loadAllParts() {
  try {
    partHint.textContent = "⏳ Memuat master part...";
    partHint.style.color = "gray";

    let allData = [];
    let from = 0;
    const PAGE_SIZE = 1000;

    while (true) {
      const { data, error } = await supabaseClient
        .from("master_kode")
        .select("id, kode, material")
        .is("deleted_at", null)
        .order("id", { ascending: true })
        .range(from, from + PAGE_SIZE - 1);

      if (error) throw error;

      if (!data || !data.length) break;

      allData = allData.concat(data);

     showToast(`📦 Loaded batch: ${data.length}, total: ${allData.length}`);

      if (data.length < PAGE_SIZE) break;

      from += PAGE_SIZE;
    }

    // PRE-NORMALIZE SEKALI
    allParts = allData.map(p => ({
      ...p,
      _norm: normalize(p.material)
    }));

    showToast("✅ Sinkronisiasi dengan Cloud:", allParts.length);

    if (!allParts.length) {
      partHint.textContent = "⚠️ Cloud master kosong / tidak ada akses";
      partHint.style.color = "orange";
    } else {
      partHint.textContent = "";
    }

  } catch (err) {
    showToast("❌ Sinkronisiasi error:", err);
    allParts = [];
    partHint.textContent = "❌ Gagal Sinkronisasi dengan cloud";
    partHint.style.color = "red";
  }
}


async function loadAllMaster() {
  await Promise.all([

    allLocations
      .filter(l => normalize(l.function_location) === normalize(area))

  )];

function updatePartRecognition(inputVal) {
  if (!allParts.length) {
    partHint.textContent = "⏳ Master part belum siap...";
    partHint.style.color = "gray";
    return;
  }

  const normInput = normalize(inputVal);

  // exact match (FAST)
  const exact = allParts.find(p => p._norm === normInput);

  if (exact) {
    partStandar = exact.material;
    partId = exact.id;
    partHint.textContent = "✅ Part Tersedia";
    partHint.style.color = "green";
  } else {
    partStandar = null;
    partId = null;
    partHint.textContent = "ℹ️ Pilih dari daftar";
    partHint.style.color = "#007aff";
  }

  // partial match (LIMITED)
  const options = [];
  for (let i = 0; i < allParts.length; i++) {
    const p = allParts[i];
    if (p._norm.includes(normInput)) {
      options.push(p);
      if (options.length >= 40) break; // HARD LIMIT
    }
  }

  if (options.length) {
    partList.innerHTML = options
      .map(p => `<li data-id="${p.id}">${p.material}</li>`)
      .join("");
    partList.style.display = "block";
  } else {
    partList.style.display = "none";
  }
}

      partHint.textContent = "";
      partStandar = null;
      partId = null;
      return;
    }
    updatePartRecognition(val);
  }, 180); // debounce

  async function openCamera() {
    try {
      stream = await navigator.mediaDevices.getUserMedia({
        video: { facingMode: "environment" },
        audio: false
      });
      cameraStream.srcObject = stream;
      cameraStream.play();
      cameraModal.style.display = "flex";

      //console.error(e);
      showToast("Tidak bisa membuka kamera (izin dibutuhkan atau tidak tersedia)");
    }
  }

  function closeCamera() {
    if (stream) {
      stream.getTracks().forEach(t => t.stop());
      stream = null;
    }
    isPickingFile = false;
    cameraModal.style.display = "none";
  }

  /* ======================
     CAPTURE TO CROP
  ====================== */
  function capturePhoto() {
    if (!cameraStream.videoWidth || !cameraStream.videoHeight) {
      showToast("Kamera belum siap");
      return;
    }
    const canvas = document.createElement("canvas");
    canvas.width = cameraStream.videoWidth;
    canvas.height = cameraStream.videoHeight;
    const ctx = canvas.getContext("2d");
    ctx.drawImage(cameraStream, 0, 0, canvas.width, canvas.height);
    canvas.toBlob(blob => {
      if (!blob) {
        showToast("Gagal mengambil foto");
        return;
      }
      selectedFile = blob;
      closeCamera();
      openCropper(URL.createObjectURL(blob));
    }, "image/jpeg", 0.95);
  }

  /* ======================
     CROP
  ====================== */
  function openCropper(url) {
    const img = document.getElementById("cropImage");
    img.src = url;
    cropModal.style.display = "flex";

    if (cropper) cropper.destroy();
    cropper = new Cropper(img, {
      aspectRatio: NaN,
      viewMode: 1,
      movable: true,
      zoomable: true,
      background: false
    });
  }

  function closeCrop() {
    cropModal.style.display = "none";
    if (cropper) {
      cropper.destroy();
      cropper = null;
    }
  }

  function applyCrop() {
    if (!cropper) return showToast("Tidak ada gambar untuk dipotong");
    cropper.getCroppedCanvas().toBlob(blob => {
      if (!blob) return showToast("Gagal memproses gambar");
      croppedBlob = blob;
      preview.src = URL.createObjectURL(blob);
      preview.style.display = "block";
      isPickingFile = false;
      closeCrop();
    }, "image/jpeg", 0.9);
  }

  /* ======================
     UTILS: compress
  ====================== */
  async function blobToImage(blob){
    return new Promise((resolve, reject) => {
      const url = URL.createObjectURL(blob);
      const img = new Image();
      img.onload = () => { URL.revokeObjectURL(url); resolve(img); };
      img.onerror = () => { URL.revokeObjectURL(url); reject(new Error("img load error")); };
      img.src = url;
    });
  }

  async function compressBlobToLimit(blob, maxBytes = 1024 * 1024){
    if (!blob) return blob;
    if (blob.size <= maxBytes) return blob;

    try {
      const img = await blobToImage(blob);
      const maxDim = 1200;
      const scale = Math.min(1, Math.min(maxDim / img.width, maxDim / img.height));
      const canvas = document.createElement("canvas");
      canvas.width = Math.round(img.width * scale);
      canvas.height = Math.round(img.height * scale);
      const ctx = canvas.getContext("2d");
      ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
      return new Promise(resolve => {
        canvas.toBlob(b => resolve(b), "image/jpeg", 0.7);
      });
    } catch (err) {
      // kalau gagal compress, return original blob
      showToast("compress gagal, mengembalikan ke original", err);
      return blob;
    }
  }

    .single();

  showToast("Login sebagai:", currentUsername, currentUserEmail);
}

  }

  if (!fileForUpload) {
    showToast("Foto wajib diunggah!");
    return;
  }

  isSubmitting = true;
  submitBtn.disabled = true;
  showLoading();

  try {
    const fileToUpload = await compressBlobToLimit(fileForUpload, 1024 * 1024);

    const fileExt = "jpg";
    const filename = `sparepart_request/${Date.now()}_${Math.random().toString(36).slice(2)}.${fileExt}`;

    const { error: uploadError } = await supabaseClient.storage
      .from("Photos")
      .upload(filename, fileToUpload);
    if (uploadError) throw uploadError;

    const foto_url = supabaseClient.storage
      .from("Photos")
      .getPublicUrl(filename).data.publicUrl;

    if (!currentUserEmail || !currentUsername) throw new Error("User belum login");

    const partIdToSend = partId || null;

    const { error: insertError } = await supabaseClient
      .from("sparepart_requests")
      .insert([{
        mesin: mesinVal,
        nama_part: partFinal,
        area: areaVal,
        sub_area: subVal,
        qty: parseInt(qtyVal),
        alasan: alasanVal,
        foto_url: foto_url,
        request_by: currentUsername,
        request_by_email: currentUserEmail,
        status: "PENDING",
        master_kode_id: partIdToSend,
        is_new_part: partIdToSend ? false : true
      }]);

    if (insertError) throw insertError;

    showToast("Berhasil dikirim ✅");

    // RESET FORM
    if (preview) {
      preview.style.display = "none";
      preview.src = "";
    }
    selectedFile = null;
    croppedBlob = null;
    if (functionInput) functionInput.value = "";
    if (subInput) subInput.value = "";
    if (document.getElementById("mesin")) document.getElementById("mesin").value = "";
    if (namaPartInput) namaPartInput.value = "";
    partStandar = null;
    partId = null;
    if (document.getElementById("qty")) document.getElementById("qty").value = "";
    if (document.getElementById("alasan")) document.getElementById("alasan").value = "";

  } catch (err) {
    console.error(err);
    showToast("Terjadi kesalahan saat mengirim");
  } finally {
    hideLoading();
    isSubmitting = false;
    submitBtn.disabled = false;
  }
});



  /* ======================
     LOGOUT
  ====================== */
  function logout(){
    try { localStorage.removeItem("user"); } catch(e){}
    if (supabaseClient && supabaseClient.auth) supabaseClient.auth.signOut().catch(()=>{});
    window.location.href = "index.html";
  }
  // ringan & tidak freeze
document.addEventListener("keydown", e => {
  if (
    e.key === "F12" ||
    (e.ctrlKey && e.shiftKey && ["I", "C", "J"].includes(e.key)) ||
    (e.ctrlKey && e.key === "U")
  ) {
    e.preventDefault();
    e.stopPropagation();
  }
});

loadUserData();

}); // end DOMContentLoaded
</script>
